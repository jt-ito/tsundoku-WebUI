<!doctype html>
<html>
    <head>
        <title>tsundoku</title>
        <meta name="apple-mobile-web-app-title" content="tsundoku" />
        <meta name="description" content="A manga reader that runs tachiyomi's extensions" />

        <meta charset="utf-8" />

        <meta name="viewport" content="minimum-scale=1, initial-scale=1, viewport-fit=cover, width=device-width" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />

        <link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
        <link rel="shortcut icon" href="/favicon.ico?v=2" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <style>
            /* iOS 26/27 home-screen apps: the system blurs the top edge unless a painted fixed element sits there. This one
               is painted but shows nothing (background-clip: text with no text), so pages without an app bar (the reader)
               get rid of the blur too. */
            @media (display-mode: standalone) {
                /* the reader keeps the system blur (iPhone and iPad) */
                .reader-open #top-edge {
                    display: none;
                }
                #top-edge {
                    position: fixed;
                    inset: 0 0 auto;
                    height: 11px;
                    z-index: 2147483647;
                    pointer-events: none;
                    /* the page's own background (theme, light or dark), so iOS paints the status bar area in it */
                    background-color: var(--top-edge-color, inherit);
                    -webkit-background-clip: text;
                    background-clip: text;
                }
            }
        </style>
        <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <div id="top-edge" aria-hidden="true"></div>
        <script type="module" src="./src/index.tsx"></script>
        <script>
            const backgroundColor = (() => {
                let storageValue;
                try {
                    const subpath = (() => {
                        const baseTag = document.querySelector('base');
                        if (!baseTag) {
                            return '';
                        }

                        return baseTag.href.replace(window.location.origin, '').slice(0, -1);
                    })();
                    storageValue = window.localStorage.getItem(`suwayomi_webui_${subpath}_theme_background`);
                } catch (error) {
                    return null;
                }

                try {
                    return JSON.parse(storageValue);
                } catch (e) {
                    return storageValue;
                }
            })();

            if (backgroundColor) {
                document.documentElement.style.backgroundColor = backgroundColor;
                // android chromium-based browser/pwa background color (e.g. top status bar and navigation bar) will change dynamically based on meta theme-color
                let themeColorMeta = document.querySelector('meta[name="theme-color"]');
                if (!themeColorMeta) {
                    themeColorMeta = document.createElement('meta');
                    themeColorMeta.setAttribute('name', 'theme-color');
                    document.head.appendChild(themeColorMeta);
                }
                if (themeColorMeta.getAttribute('content') !== backgroundColor) {
                    themeColorMeta.setAttribute('content', backgroundColor);
                }
            }
        </script>

    </body>
</html>
